# Config for containerized smoke/live runs on this machine.
# Point GRAPH_API_CONFIG at this file.

vlm:
  retries: 0
  fallback_labels: [chair, table, bed, cabinet, sofa, lamp, tv, door, sink,
                    toilet, shelf, desk, monitor, plant, trash can, curtain]

embedding:
  # tiny stand-in vocabulary generated by smoke_test.sh — keeps module import
  # off the 1.6 GB download path; swap for the real model for quality runs
  word2vec_path: "/tmp/smoke_w2v.bin"
  word2vec_limit: 200000

association:
  max_match_distance_m: 1.5

rooms:
  default_room_id: "room_0"   # no SLAM in this setup -> admit objects anyway

paths:
  operations_log: "/tmp/operations.txt"
  vitsam_encoder: "/models/vitsam/l2_encoder.onnx"
  vitsam_decoder: "/models/vitsam/l2_decoder.onnx"

frames:
  camera: "habitat_camera_optical"   # the feed publishes RGB/depth under the OPTICAL frame

habitat:
  single_floor: true      # HM3D 00861 is two-storey; evaluation runs on the start floor
  floor_tolerance_m: 0.5
