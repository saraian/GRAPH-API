# Config for containerized smoke/live runs on this machine.
# Point GRAPH_API_CONFIG at this file.

vlm:
  retries: 0

embedding:
  # tiny stand-in vocabulary generated by smoke_test.sh — keeps module import
  # off the 1.6 GB download path; swap for the real model for quality runs
  word2vec_path: "/tmp/smoke_w2v.bin"
  word2vec_limit: 200000


rooms:
  default_room_id: "room_0"   # no SLAM in this setup -> admit objects anyway

paths:
  operations_log: "/tmp/operations.txt"
  vitsam_encoder: "/models/vitsam/l2_encoder.onnx"
  vitsam_decoder: "/models/vitsam/l2_decoder.onnx"

frames:
  camera: "habitat_camera_optical"   # the feed publishes RGB/depth under the OPTICAL frame

habitat:
  single_floor: true      # HM3D 00861 is two-storey; evaluation runs on the start floor
  floor_tolerance_m: 0.5
  mapping_seconds: 150.0  # continuous mapping tour (seconds)
  walk_frames: 6         # frames moving per burst
  dwell_frames: 0       # 0 = agent never stops (owner, 2026-08-31). FEED_DWELL in live_run.sh overrides this.
  fps: 3.0
  # OWNER RULING 25, 2026-09-01: 1280x960. SET HERE AND NOT ONLY IN CODE, because
  # perception_module/config.py supplies habitat.width 640 as a module default and the merged
  # config wins over habitat_feed_host.py's own fallback — I raised the code default to 1280 and
  # the effective value stayed 640. Found by resolving CFG the way room_manager does rather than
  # by reading my own change and believing it.
  #
  # Measured: 89.1 ms/frame render at 1280x960, 11.2 fps against a 3 fps feed, 8.60 MB/frame.
  # 4x the pixels for no frame-rate cost. The air-conditioner sliver goes 28x14 -> 56x28.
  width: 1280
  height: 960
  # Both explicit rather than left to a code default, so the bundle's resolved_config reports a
  # value that came from a file somebody can read.
  min_floor_share: 0.10   # UNMEASURED; storeys measured at 46.8/45.9%, non-floors at 0.7/3.3%
  floor_confinement: teleport

  # GA-465. THE EXPLORATION SCHEDULE, documented in the TRACKED config because regolo_config.yaml is
  # gitignored (the endpoint is a credential, GA-319) and a fresh checkout would otherwise never see
  # these names. Every value below is the code's own default, so writing them changes nothing.
  regenerate_schedule: false   # true rebuilds the schedule even when a matching one is cached
  exploration_laps: 3          # complete passes of the storey; every lap is the SAME trajectory
  move_function: follower      # follower (plans over the navmesh) or straight (drives at the point)
  post_scan_hook: ""           # module:function run after every completed 360 scan


hooks:
  search_paths: ["/found"]
  filter: ""   # no extension in the smoke config: this repository ships none

perception:
  backend: "modal"
  # The deployed endpoint URL is a CREDENTIAL: the Modal app exposes fastapi_endpoint
  # with no proxy auth, so anyone holding this URL can spend the account's GPU budget.
  # It is read from MODAL_PERCEPTION_URL in the launcher's environment and must never be
  # committed again. Empty here on purpose.
  modal_endpoint: ""
  # GA-477. DECLARED AT THE CODE DEFAULT, so it changes nothing about a run and makes the value
  # answerable from the run's own config. Probe a10 compares this guard against the worst frame age
  # the PREVIOUS run rejected; without the key it SKIPPED, and a skipped probe fails the gate -- so
  # the tracked smoke config could not pass its own gate. Found by the ontology lane on their own
  # config, which had the same gap.
  max_frame_age_s: 1.0
  # seconds; a remote perception call. 25.0 was hardcoded and sat below all
  # seven measured Modal cold starts (25.3-47.7 s, 2026-08-30/31).
  # INTERIM, NOT MEASURED. 180 was not derived from a distribution and must not be cited as
  # one. It is a diagnostic ceiling: the in-run call has exceeded 60 s in three runs and the
  # raise records no elapsed time, so nobody knows whether the real figure is 65 s or 300.
  # This is set high enough for a run to survive and produce per-cycle timings — the
  # measurement that should replace it.
  #
  # This is NOT the widen-the-timeout move a4's ruling forbids. That ruling forbids choosing a
  # number from one sample and calling it right. This number is labelled wrong on purpose.
  #
  # Isolated calls to the same endpoint with the same payload run 43.6 s cold and 1.2-1.4 s
  # warm, so the service is not the suspect — the in-container context is: the call happens
  # after a ~42 s VLM call in the same cycle, beside rtabmap and the object manager.
  #
  # REPLACE FROM MEASURED IN-RUN VALUES.
  cloud_timeout_s: 180.0
