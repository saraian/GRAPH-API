# Config for containerized smoke/live runs on this machine.
# Point GRAPH_API_CONFIG at this file.

vlm:
  retries: 0
  fallback_labels: [
    chair, armchair, office chair, dining chair, stool, sofa, couch, bench,
    table, dining table, coffee table, desk, nightstand, bed, wardrobe, dresser,
    cabinet, kitchen cabinet, bookshelf, shelf, bookcase, drawer,
    refrigerator, microwave oven, oven, stove, dishwasher, toaster, coffee machine,
    tv, monitor, laptop, speaker, clock,
    door, doorway, window, sink, kitchen sink, bathroom sink, toilet, bathtub,
    shower, towel rack, mirror, vanity mirror,
    lamp, floor lamp, table lamp, desk lamp, pendant lamp, ceiling light,
    plant, potted plant, trash can, wastebasket, curtain, blinds, rug, carpet,
    pillow, cushion, vase, artwork, painting, picture frame, box, basket, bag
  ]

embedding:
  # tiny stand-in vocabulary generated by smoke_test.sh — keeps module import
  # off the 1.6 GB download path; swap for the real model for quality runs
  word2vec_path: "/tmp/smoke_w2v.bin"
  word2vec_limit: 200000

association:
  max_match_distance_m: 1.5

rooms:
  default_room_id: "room_0"   # no SLAM in this setup -> admit objects anyway

paths:
  operations_log: "/tmp/operations.txt"
  vitsam_encoder: "/models/vitsam/l2_encoder.onnx"
  vitsam_decoder: "/models/vitsam/l2_decoder.onnx"

frames:
  camera: "habitat_camera_optical"   # the feed publishes RGB/depth under the OPTICAL frame

habitat:
  single_floor: true      # HM3D 00861 is two-storey; evaluation runs on the start floor
  floor_tolerance_m: 0.5
  mapping_seconds: 150.0  # continuous mapping tour (seconds)
  walk_frames: 6         # frames moving per burst
  dwell_frames: 60       # frames stationary for perception
  fps: 3.0

perception:
  backend: "modal"
  modal_endpoint: "https://emanuelemusumeci--lost3dsg-perception-perceptionservice-predict.modal.run"
