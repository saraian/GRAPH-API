# Overlay for a fresh RTAB-Map RGB-D mapping run from a TIAGo rosbag.
# The launcher omits the recorded /map topic and filters map-frame transforms
# from /tf and /tf_static, so RTAB-Map is the sole owner of map -> odom.

simulation: false

merge:
  periodic_interval_s: 5.0

frames:
  camera: "head_front_camera_color_optical_frame"
  motion_watch: ["base_footprint", "head_1_link", "head_2_link"]
  motion_watch_base: []

paths:
  output_dir: "/ws/output"
  operations_log: "/ws/output/operations.txt"
  vitsam_encoder: "/models/vitsam/l2_encoder.onnx"
  vitsam_decoder: "/models/vitsam/l2_decoder.onnx"

embedding:
  word2vec_path: "/ws/smoke_w2v.bin"
  word2vec_limit: 200000

tf:
  # RTAB-Map publishes map -> odom.  The map frame is intentionally the same
  # name as the filtered global frame in the recording.
  world_frame: map
  lookup_timeout: 0.2

bev:
  source: ros
  map_topic: /rtabmap/map
  base_frame: base_footprint
  cloud_map_topic: /rtabmap/cloud_map

services:
  feed_enabled: false

rooms:
  default_room_id: "room_0"

vlm:
  base_url: "https://api.regolo.ai/v1"
  model: "gemma4-31b"
  api_key: ""
  enable_thinking: false
  timeout: 120.0
  retries: 1
  crop_timeout: 60.0
  crop_concurrency: 2

perception:
  backend: "local"
  score_threshold: 0.15
  nms_threshold: 0.50
  fov_max_depth_m: 6.0

association:
  max_misses_before_delete: 1

hooks:
  search_paths: []
  filter: ""
  refiner: ""
  store: ""
  decisions_log: ""
